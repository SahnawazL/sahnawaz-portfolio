name: Speed check (Lighthouse)
# Runs Google's Lighthouse on the live site as a phone and a desktop, every
# Monday and on demand, and writes the scores to the run's summary page.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 3 * * 1'
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Lighthouse
        run: |
          npm i -g lighthouse@12 >/dev/null 2>&1
          URL=https://sahnawaz-portfolio.vercel.app/
          # one phone run swings by 20+ points on shared runners, so the phone
          # is measured three times and the middle run is the one reported
          for form in mobile desktop; do
            runs=1; [ "$form" = mobile ] && runs=3
            for n in $(seq 1 $runs); do
              flags="--quiet --chrome-flags=--headless=new --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lh-$form-$n.json"
              [ "$form" = desktop ] && flags="$flags --preset=desktop"
              for try in 1 2; do lighthouse "$URL" $flags && break; sleep 10; done
            done
            node -e '
              const fs = require("fs"), f = process.argv[1];
              const got = fs.readdirSync(".").filter(x => x.startsWith("lh-" + f + "-") && x.endsWith(".json"))
                .map(x => ({ x, p: JSON.parse(fs.readFileSync(x)).categories.performance.score || 0 })).sort((a, b) => a.p - b.p);
              if (!got.length) process.exit(0);
              console.log(f + " runs:", got.map(g => Math.round(g.p * 100)).join(", "));
              fs.copyFileSync(got[Math.floor((got.length - 1) / 2)].x, "lh-" + f + ".json");
            ' "$form"
          done
      - name: Write the scores
        run: |
          node -e '
          const fs = require("fs");
          let md = "## Lighthouse scores\n\n| | Performance | Accessibility | Best practices | SEO | LCP | TBT | CLS |\n|---|---|---|---|---|---|---|---|\n";
          for (const f of ["mobile", "desktop"]) {
            if (!fs.existsSync("lh-" + f + ".json")) { md += "| " + f + " | failed |||||||\n"; continue; }
            const r = JSON.parse(fs.readFileSync("lh-" + f + ".json")), c = r.categories, a = r.audits, s = k => Math.round((c[k].score || 0) * 100);
            md += `| ${f} | ${s("performance")} | ${s("accessibility")} | ${s("best-practices")} | ${s("seo")} | ${a["largest-contentful-paint"].displayValue} | ${a["total-blocking-time"].displayValue} | ${a["cumulative-layout-shift"].displayValue} |\n`;
            /* every failed check outside Performance, with what triggered it */
            for (const cat of ["accessibility", "best-practices", "seo"]) for (const ref of c[cat].auditRefs) {
              const x = a[ref.id];
              if (!x || x.score === null || x.score >= 1 || ref.weight === 0 && x.scoreDisplayMode !== "binary") continue;
              const it = ((x.details || {}).items || []).slice(0, 4).map(i => i.description || i.source && i.source.url || i.url || i.sourceLocation && i.sourceLocation.url || (i.node && i.node.selector) || JSON.stringify(i).slice(0, 120));
              console.log(f + " [" + cat + "] " + x.id + ": " + x.title + " :: " + JSON.stringify(it).slice(0, 500));
            }
            const shifts = ((a["layout-shifts"] || {}).details || {}).items || [];
            if (shifts.length) console.log(f + " layout shifts:", JSON.stringify(shifts.slice(0, 4).map(x => [x.score, x.node && x.node.selector])).slice(0, 700));
            if (f === "mobile") {
              const items = k => ((a[k] && a[k].details && a[k].details.items) || []);
              console.log("LCP element:", JSON.stringify(items("largest-contentful-paint-element").slice(0, 2)).slice(0, 600));
              console.log("LCP parts:", JSON.stringify((a["lcp-breakdown-insight"] || {}).details || {}).slice(0, 600));
              console.log("Script time:", items("bootup-time").slice(0, 10).map(i => (i.url || "").replace(/^https?:\/\/[^/]+/, "") + " " + Math.round(i.total) + "ms").join(" | "));
              console.log("Main thread:", items("mainthread-work-breakdown").slice(0, 7).map(i => i.groupLabel + " " + Math.round(i.duration) + "ms").join(" | "));
              console.log("Render blocking:", items("render-blocking-resources").concat(items("render-blocking-insight")).map(i => (i.url || "").replace(/^https?:\/\/[^/]+/, "") + " " + Math.round(i.wastedMs || i.totalBytes || 0)).join(" | "));
              console.log("Long tasks:", items("long-tasks").slice(0, 8).map(i => (i.url || "").replace(/^https?:\/\/[^/]+/, "") + " " + Math.round(i.duration) + "ms@" + Math.round(i.startTime)).join(" | "));
              console.log("FCP", a["first-contentful-paint"].displayValue, "SI", a["speed-index"].displayValue);
              const fails = Object.values(a).filter(x => x.score !== null && x.score < 0.9 && x.details && x.details.overallSavingsMs > 150).sort((x, y) => y.details.overallSavingsMs - x.details.overallSavingsMs).slice(0, 8);
              if (fails.length) md += "\n**Biggest phone savings:** " + fails.map(x => x.title + " (" + Math.round(x.details.overallSavingsMs) + " ms)").join(", ") + "\n\n";
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          console.log(md);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: lh-*.json
          retention-days: 14
