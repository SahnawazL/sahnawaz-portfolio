name: Video studio portfolio voice (temporary)

on:
  push:
    branches: [video-studio]
    paths: ["video/pf2/lines.json", "video/pf2/*.py", ".github/workflows/video-pf2.yml"]

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Voice
        env:
          SAMPLES: en-US-EmmaMultilingualNeural,en-IN-NeerjaNeural,en-US-AvaMultilingualNeural
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q "edge-tts>=6.1.12"
          python video/pf2/voice.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A video/pf2/out
          git commit -qm "Video studio: portfolio voice" || exit 0
          git stash -q -u || true
          for i in 1 2 3; do git pull -q --rebase origin video-studio && git push -q origin HEAD:video-studio && break; sleep 5; done
