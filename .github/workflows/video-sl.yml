name: Video studio StudyLens (temporary)

on:
  push:
    branches: [video-studio]
    paths: ["video/sl/capture.mjs", "video/sl/asks.json", "video/sl/lines.json", "video/sl/*.py", ".github/workflows/video-sl.yml"]

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: App files and answers
        run: |
          npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node video/sl/capture.mjs
      - name: Hindi voice
        run: |
          if [ -f video/sl/lines.json ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
            pip install -q "edge-tts>=6.1.12"
            python video/sl/voice.py
          fi
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A video/sl/out
          git commit -qm "Video studio: StudyLens files, answers and voice" || exit 0
          git stash -q -u || true
          for i in 1 2 3; do git pull -q --rebase origin video-studio && git push -q origin HEAD:video-studio && break; sleep 5; done
