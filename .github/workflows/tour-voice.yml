name: Tour voice

# Makes the 60-second tour's narration (one small MP3 per stop) whenever the
# tour's captions change, and commits the clips to audio/tour/.
on:
  push:
    branches: [main]
    paths:
      - "js/tour.js"
      - "scripts/tour-voice/**"
      - ".github/workflows/tour-voice.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tour-voice
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<2.9" "kokoro>=0.9.4,<1" soundfile numpy
          python -m spacy download en_core_web_sm -q || true
      - name: Make the clips
        run: |
          set -o pipefail
          python scripts/tour-voice/make.py 2>&1 | tee "$RUNNER_TEMP/make.log" || {
            echo "::error title=Tour voice failed::$(tail -c 3500 "$RUNNER_TEMP/make.log" | tr '\n' ' ' | sed 's/%/%25/g')"; exit 1; }
          grep -E "^made|^total|timing by length" "$RUNNER_TEMP/make.log" | while read -r l; do echo "::notice title=Tour voice::$l"; done
      - name: Commit the clips
        run: |
          # identity for the commit AND for the rebase below (a rebase re-creates
          # the commit when something else was pushed while the clips were made)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio/tour
          if git diff --cached --quiet; then echo "clips already up to date"; exit 0; fi
          git commit -m "Tour voice: narration clips for the current captions"
          for n in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            echo "push attempt $n did not go through, retrying"; sleep 5
          done
          exit 1
