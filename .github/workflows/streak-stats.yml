name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"   # Runs every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"  # Also runs if you edit this file
  workflow_dispatch:       # Lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          # Same theme/colors already in the README — 1:1 swap of
          # streak-stats.demolab.com's query params, so the generated SVG
          # looks identical to what's currently there.
          options: user=${{ github.repository_owner }}&theme=tokyonight-duo&hide_border=true&background=0d1117&ring=00ffff&fire=ff6b6b&currStreakLabel=00ffff&sideLabels=c9d1d9&dates=c9d1d9
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
