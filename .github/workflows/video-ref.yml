name: Video studio reference frames (temporary)

on:
  push:
    branches: [video-studio]
    paths: ["video/ref/urls.txt", ".github/workflows/video-ref.yml"]

jobs:
  look:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Frames
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U yt-dlp
          mkdir -p ref && n=0
          while read -r u; do
            n=$((n+1)); [ -z "$u" ] && continue
            yt-dlp -q --no-warnings -f "b[height<=1280]/b" -o "ref/r$n.%(ext)s" "$u" || { echo "r$n: download failed"; continue; }
            f=$(ls ref/r$n.* | head -1)
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f"); echo "r$n duration $d"
            ffmpeg -v error -i "$f" -vf "fps=2,scale=180:-2,tile=8x4" -q:v 4 "ref/r${n}_sheet_%02d.jpg"
            ffmpeg -v error -i "$f" -vn -ac 1 -ar 16000 "ref/r$n.wav" || true
            rm -f "$f"
          done < video/ref/urls.txt
          ls -la ref
      - uses: actions/upload-artifact@v4
        with: { name: ref, path: ref, retention-days: 1 }
