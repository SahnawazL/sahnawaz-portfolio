name: Listen clips

# Makes the pre-made clips behind the site's speaker buttons, whenever their
# scripts or the prices they quote change. Unchanged clips are left alone.
on:
  workflow_dispatch:
    inputs:
      only: { description: "Clip ids, comma separated (blank = all)", default: "" }
      limit: { description: "Most clips to make (0 = all)", default: "0" }

permissions:
  contents: write

concurrency:
  group: say-voice
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q orpheus-cpp huggingface_hub numpy onnxruntime
          pip install -q llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -q faster-whisper
      - name: Make the clips
        env:
          SAY_ONLY: ${{ github.event.inputs.only }}
          SAY_LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          python scripts/say/make.py 2>&1 | tee "$RUNNER_TEMP/make.log"
          grep -E "^made|^LEFT OUT|^finished" "$RUNNER_TEMP/make.log" | while read -r l; do echo "::notice title=Listen clips::$l"; done
