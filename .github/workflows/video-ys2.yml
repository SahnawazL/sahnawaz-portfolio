name: Video studio YojanaSahay tour (temporary)

# Temporary branch only: builds the YojanaSahay app, records the narration and
# saves real assistant answers for the promo film, then commits them here.
on:
  push:
    branches: [video-studio]
    paths: ["video/ys2/lines.json", "video/ys2/*.py", "video/ys2/*.mjs", "video/ys2/ai_script.json", "video/ys2/mock/**", ".github/workflows/video-ys2.yml"]

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: SahnawazL/Yojana-Sahay, path: ys }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the app
        working-directory: ys
        run: |
          if [ -f ../video/ys2/out/ys-dist.tgz ]; then echo "app already built"; exit 0; fi
          npm install --no-audit --no-fund --loglevel=error
          npm run build
          mkdir -p ../video/ys2/out && tar -czf ../video/ys2/out/ys-dist.tgz -C dist .
          du -sh dist ../video/ys2/out/ys-dist.tgz
      - name: Demo admin build (film only, never deployed)
        working-directory: ys
        run: |
          if [ -f ../video/ys2/out/ys-demo.tgz ]; then echo "demo already built"; exit 0; fi
          [ -d node_modules ] || npm install --no-audit --no-fund --loglevel=error
          mkdir -p src/__demo__ && cp ../video/ys2/mock/*.js src/__demo__/
          cat > vite.demo.config.mjs <<'CFG'
          import base from "./vite.config.js";
          import path from "path";
          export default { ...base, resolve: { alias: [
            { find: /^firebase\/firestore$/, replacement: path.resolve("src/__demo__/firestore.js") },
            { find: /^firebase\/auth$/, replacement: path.resolve("src/__demo__/auth.js") } ] },
            build: { ...(base.build || {}), outDir: "dist-demo" } };
          CFG
          npx vite build --config vite.demo.config.mjs
          tar -czf ../video/ys2/out/ys-demo.tgz -C dist-demo .
          du -sh ../video/ys2/out/ys-demo.tgz
      - name: Record assistant answers
        run: |
          if [ -f video/ys2/out/ai2.json ]; then echo "answers already saved"; exit 0; fi
          mkdir -p /tmp/rec /tmp/dist && tar -xzf video/ys2/out/ys-dist.tgz -C /tmp/dist
          (cd /tmp/rec && npm init -y >/dev/null && npm i playwright@1.49.1 --no-audit --no-fund --loglevel=error && npx playwright install --with-deps chromium > /dev/null)
          NODE_PATH=/tmp/rec/node_modules node --experimental-default-type=module -e "import('/tmp/rec/node_modules/playwright/index.mjs').then(()=>console.log('pw ok'))" || true
          cp video/ys2/record.mjs /tmp/rec/record.mjs
          node /tmp/rec/record.mjs /tmp/dist || true
      - name: Voice
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<2.9" "kokoro>=0.9.4,<1" soundfile numpy
          python -m spacy download en_core_web_sm -q || true
          python video/ys2/voice_kokoro.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A video/ys2/out
          git commit -qm "Video studio: YojanaSahay tour build and narration" || exit 0
          git stash -q -u || true
          for i in 1 2 3; do git pull -q --rebase origin video-studio && git push -q origin HEAD:video-studio && break; sleep 5; done
