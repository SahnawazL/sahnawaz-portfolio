name: Voice lab
on:
  push:
    branches: [voice-lab]
    paths: ["scripts/voice-lab/**", ".github/workflows/voice-lab.yml"]
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          pip install -q orpheus-cpp huggingface_hub numpy onnxruntime
          pip install -q llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          nproc
      - name: Try the voices
        run: python scripts/voice-lab/lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lab, path: lab/ }
