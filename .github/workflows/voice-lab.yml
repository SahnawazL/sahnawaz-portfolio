name: Voice lab
on:
  push:
    branches: [voice-lab]
    paths: ["scripts/voice-lab/**", ".github/workflows/voice-lab.yml"]
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          pip install -q orpheus-cpp huggingface_hub numpy onnxruntime
          pip install -q llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          nproc
      - name: Try the voices
        run: python scripts/voice-lab/lab.py
      - name: Keep the samples on this branch
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper
          for f in lab/*.wav; do ffmpeg -y -v error -i "$f" -af "silenceremove=stop_periods=-1:stop_duration=1.2:stop_threshold=-45dB,loudnorm=I=-16:TP=-1.5" -ar 24000 -ac 1 -b:a 96k "${f%.wav}.mp3"; done
          python scripts/voice-lab/hear.py || true
          rm lab/*.wav
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab && git commit -q -m "Voice lab samples" && git push -q origin HEAD:voice-lab
