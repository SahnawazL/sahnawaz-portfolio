name: Video studio desk photos (temporary)

permissions:
  contents: write

on:
  push:
    branches: [video-studio]
    paths: ["video/ref/photos.txt", ".github/workflows/video-photos.yml"]

jobs:
  get:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Photos
        run: |
          mkdir -p photos && echo run2
          while read -r id a b; do
            [ -z "$id" ] && continue
            if [ "$a" = "PAGE" ]; then
              u=$(curl -sL "$b" | grep -oE 'https://burst\.shopifycdn\.com/photos/[^"?]+\.jpg' | head -1); echo "$id -> $u"
            else u="$a"; fi
            curl -sL -o "photos/$id.jpg" "$u" && file "photos/$id.jpg" && identify -format "%w x %h\n" "photos/$id.jpg" || echo "$id failed"
          done < video/ref/photos.txt
      - name: Move
        run: mkdir -p video/ref/photos && cp photos/*.jpg video/ref/photos/
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A video/ref
          git commit -qm "Video studio: desk photos" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin video-studio && git push -q origin HEAD:video-studio && break; sleep 5; done
