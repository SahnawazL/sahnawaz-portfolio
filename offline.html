<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · ByteWithSahnawaz</title>
<link rel="icon" href="./favicon.ico">
<meta name="theme-color" content="#0b1a2b">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#cfe8fa;
    background:radial-gradient(120% 120% at 10% 0%,#0d2136 0%,#071320 55%,#050d16 100%)}
  .card{width:100%;max-width:380px;text-align:center}
  .hex{width:46px;height:46px;margin:0 auto 18px;color:#5ac8ff}
  h1{font-size:1.32rem;font-weight:700;color:#eaf6ff;letter-spacing:-.2px}
  .sub{margin:9px 0 22px;font-size:.92rem;line-height:1.6;color:rgba(170,208,233,.72)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffcf6b;
    margin-right:7px;vertical-align:middle}
  button{width:100%;padding:13px;border-radius:12px;cursor:pointer;font:600 .92rem Inter,sans-serif;
    color:#04121a;background:linear-gradient(135deg,#5ae0ff,#4fe0a2);border:none}
  button:active{transform:scale(.98)}
  .note{margin-top:18px;font-size:.76rem;line-height:1.6;color:rgba(150,190,220,.5)}
  .brand{margin-top:26px;font:600 .7rem/1 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(150,190,220,.42)}
</style>
</head>
<body>
  <div class="card">
    <svg class="hex" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2l8.5 5v10L12 22 3.5 17V7z"/><path d="M9.5 9.5 7 12l2.5 2.5M14.5 9.5 17 12l-2.5 2.5"/>
    </svg>
    <h1><span class="dot"></span>You're offline</h1>
    <p class="sub">This page needs a connection. The parts of the portfolio you've already
       visited are saved on your device and will still open.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="note">The page reloads by itself as soon as your connection returns.</p>
    <div class="brand">ByteWithSahnawaz</div>
  </div>
<script>
  /* come back automatically the moment the network returns */
  addEventListener('online', function () { location.reload(); });
  setInterval(function () { if (navigator.onLine) location.reload(); }, 5000);
</script>
</body>
</html>
